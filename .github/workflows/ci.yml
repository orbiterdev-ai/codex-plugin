name: CI - Codex Plugin E2E & Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check hook and test syntax
        run: |
          node --check hooks/orbiter-codex-hook.cjs
          node --check plugins/orbiter-dev/hooks/orbiter-codex-hook.cjs
          node --check tests/e2e_codex_plugin.test.js
      - name: Run E2E and adversarial security test suite
        run: node --test tests/e2e_codex_plugin.test.js

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks v8.30.1 secret scan (MIT CLI)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks git --no-banner --redact
          /tmp/gitleaks dir --no-banner --redact
